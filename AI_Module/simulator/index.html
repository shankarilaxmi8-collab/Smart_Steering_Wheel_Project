<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Steering Wheel Photorealistic 3D Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root {
--bg-dark: #02040a;
--panel-bg: rgba(10, 15, 30, 0.8);
--border-color: rgba(255, 255, 255, 0.15);
--accent-blue: #00d2ff;
--status-normal: #10b981;
--status-warning: #f59e0b;
--status-cardiac: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: 'Inter', sans-serif;
background: var(--bg-dark);
color: #e2e8f0;
height: 100vh;
width: 100vw;
overflow: hidden;
}
#webgl-container {
width: 100vw;
height: 100vh;
position: absolute;
top: 0;
left: 0;
z-index: 1;
}
.overlay-controls {
position: absolute;
top: 30px;
left: 30px;
z-index: 10;
background: var(--panel-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border-color);
border-radius: 20px;
padding: 20px 24px;
display: flex;
flex-direction: column;
gap: 16px;
box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
}
.overlay-controls h2 {
font-size: 1.2rem;
font-weight: 800;
letter-spacing: 1px;
background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
text-transform: uppercase;
margin-bottom: 4px;
}
.mode-buttons { display: flex; gap: 10px; }
.mode-btn {
padding: 10px 16px;
border: 1px solid rgba(255,255,255,0.1);
border-radius: 10px;
background: rgba(30, 41, 59, 0.6);
color: #94a3b8;
font-size: 0.8rem;
cursor: pointer;
font-weight: 600;
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.mode-btn:hover { background: rgba(255,255,255,0.1); }
.mode-btn.active {
border-color: var(--accent-blue);
color: #fff;
background: rgba(0, 210, 255, 0.15);
box-shadow: 0 0 15px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
}
.cam-hint { font-size: 0.75rem; color: #64748b; font-weight: 500; }

.telemetry-hud {
position: absolute;
bottom: 30px;
right: 30px;
z-index: 10;
background: var(--panel-bg);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid var(--border-color);
border-radius: 24px;
padding: 24px;
width: 340px;
display: flex;
flex-direction: column;
gap: 14px;
box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
transition: all 0.3s ease;
}
.hud-header { display: flex; gap: 12px; align-items: stretch; }
.status-badge {
flex-grow: 1;
padding: 12px 16px;
border-radius: 12px;
display: flex;
justify-content: space-between;
align-items: center;
font-weight: 800;
font-size: 1rem;
letter-spacing: 0.5px;
transition: all 0.4s ease;
}
.toggle-details-btn {
background: rgba(255, 255, 255, 0.05);
border: 1px solid var(--border-color);
border-radius: 12px;
color: #94a3b8;
width: 48px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1rem;
transition: all 0.3s ease;
}
.toggle-details-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
.status-badge.NORMAL { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--status-normal); color: var(--status-normal); }
.status-badge.WARNING { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--status-warning); color: var(--status-warning); }
.status-badge.CARDIAC_EVENT { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--status-cardiac); color: var(--status-cardiac); animation: alertPulse 0.8s infinite alternate; }
@keyframes alertPulse { 0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); } 100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); } }

.details-container {
display: none;
flex-direction: column;
gap: 4px;
padding: 4px 0;
border-top: 1px solid rgba(255, 255, 255, 0.05);
border-bottom: 1px solid rgba(255, 255, 255, 0.05);
animation: slideDown 0.3s ease forwards;
}
.details-container.open { display: flex; }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.metric-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; padding: 6px 0; color: #cbd5e1; }
.metric-val { color: #38bdf8; font-weight: 700; font-size: 0.95rem;}
.chart-container {
background: rgba(2, 4, 10, 0.8);
border: 1px solid rgba(255,255,255,0.05);
border-radius: 12px;
padding: 12px;
margin-top: 2px;
}
canvas#ecgCanvas { width: 100%; height: 60px; }

#restartContainer {
position: absolute;
top: 0; left: 0;
width: 100vw; height: 100vh;
display: none;
justify-content: center;
align-items: center;
z-index: 100;
background: rgba(0,0,0,0.6);
backdrop-filter: blur(8px);
animation: fadeIn 1s ease forwards;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.restart-btn {
padding: 20px 40px;
font-size: 1.2rem;
font-weight: 800;
letter-spacing: 1px;
color: #fff;
background: linear-gradient(135deg, #ef4444, #f59e0b);
border: 2px solid rgba(255,255,255,0.2);
border-radius: 16px;
cursor: pointer;
box-shadow: 0 10px 40px rgba(239, 68, 68, 0.5);
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.restart-btn:hover {
transform: scale(1.05) translateY(-5px);
box-shadow: 0 15px 50px rgba(239, 68, 68, 0.8);
}
</style>
</head>
<body>
<div id="webgl-container"></div>
<div class="overlay-controls">
<h2>Smart Steering Wheel</h2>
<div class="mode-buttons">
<button class="mode-btn active" id="btnNormal" onclick="setStress('normal')">[1] Normal</button>
<button class="mode-btn" id="btnWarning" onclick="setStress('warning')">[2] Warning</button>
<button class="mode-btn" id="btnCardiac" onclick="setStress('cardiac')">[3] Event / Crash</button>
</div>
<div class="cam-hint">
WASD to drive | Press ANY KEY to Start Engine/Audio<br>
Mouse drag to orbit</div>
</div>
<div class="telemetry-hud">
<div class="hud-header">
<div id="statusBadge" class="status-badge NORMAL">
<span id="dispStatus">NORMAL</span>
<span id="dispConf" style="font-size: 0.8em; opacity: 0.8;">100%</span>
</div>
<button id="toggleDetailsBtn" class="toggle-details-btn" onclick="toggleDetails()">▼</button>
</div>
<div id="detailsContainer" class="details-container">
<div class="metric-row"><span>Heart Rate</span><span class="metric-val" id="dispHR">72 BPM</span></div>
<div class="metric-row"><span>Temperature</span><span class="metric-val" id="dispTemp">36.6 °C</span></div>
<div class="metric-row"><span>Grip Force</span><span class="metric-val" id="dispGrip">20 N</span></div>
<div class="metric-row"><span>Stress (GSR)</span><span class="metric-val" id="dispSweat">3.0 µS</span></div>
</div>
<div class="chart-container">
<div style="font-size: 0.7rem; font-weight: 700; color: #64748b; margin-bottom: 6px; letter-spacing: 1px;">LIVE ECG WAVEFORM</div>
<canvas id="ecgCanvas" width="280" height="60"></canvas>
</div>
</div>
<div id="restartContainer">
<button class="restart-btn" onclick="location.reload()">RESTART SIMULATION</button>
</div>
<script>
function toggleDetails() {
const container = document.getElementById('detailsContainer');
const btn = document.getElementById('toggleDetailsBtn');
container.classList.toggle('open');
btn.innerText = container.classList.contains('open') ? '▲' : '▼';
}

let keys = {};
let stressMode = "normal";
let isAutoWarning = false;
let carSpeed = 0.22;
let emergencyOverride = false;
let currentBPM = 72;
let currentSTDev = 0.0;
let emergencyPhase = 0;
let rescueTimer = 0;
let ambulanceActive = false;
let ambSpeed = 0;

let healthData = {
  hr: 72,
  temp: 36.6,
  grip: 20,
  sweat: 3.0,
  conf: 100
};

let audioCtx, masterGain, engineOsc, engineFilter, engineGain, alarmOsc, alarmGain, sirenOsc, sirenGain;
let audioInitialized = false;

function initAudio() {
if (audioInitialized) return;
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
masterGain = audioCtx.createGain();
masterGain.gain.value = 0.5;
masterGain.connect(audioCtx.destination);

engineOsc = audioCtx.createOscillator();
engineOsc.type = 'triangle';
engineFilter = audioCtx.createBiquadFilter();
engineFilter.type = 'lowpass';
engineGain = audioCtx.createGain();
engineGain.gain.value = 0;
engineOsc.connect(engineFilter).connect(engineGain).connect(masterGain);
engineOsc.start();

alarmOsc = audioCtx.createOscillator();
alarmOsc.type = 'square';
alarmGain = audioCtx.createGain();
alarmGain.gain.value = 0;
alarmOsc.connect(alarmGain).connect(masterGain);
alarmOsc.start();

sirenOsc = audioCtx.createOscillator();
sirenOsc.type = 'sawtooth';
sirenGain = audioCtx.createGain();
sirenGain.gain.value = 0;
sirenOsc.connect(sirenGain).connect(masterGain);
sirenOsc.start();

audioCtx.resume();
engineGain.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.5);
audioInitialized = true;
}

function playCrashSound() {
if (!audioInitialized) return;
const bufferSize = audioCtx.sampleRate * 0.5;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
const noiseSource = audioCtx.createBufferSource();
noiseSource.buffer = buffer;
const noiseFilter = audioCtx.createBiquadFilter();
noiseFilter.type = 'lowpass';
noiseFilter.frequency.value = 1000;
const noiseGain = audioCtx.createGain();
noiseGain.gain.setValueAtTime(1, audioCtx.currentTime);
noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
noiseSource.connect(noiseFilter).connect(noiseGain).connect(masterGain);
noiseSource.start();
}

const container = document.getElementById('webgl-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1118);
scene.fog = new THREE.FogExp2(0x0a1118, 0.015);

// Adjusted Camera for an unobstructed, direct cockpit view
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(-0.95, 1.45, -1.75);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.target.set(-0.35, 0.95, -0.1);

const hemiLight = new THREE.HemisphereLight(0x557799, 0x0a1118, 0.8);
scene.add(hemiLight);
const sunLight = new THREE.DirectionalLight(0xffeedd, 1.6);
sunLight.position.set(30, 50, 30);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
scene.add(sunLight);

// ROAD ENVIRONMENT
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1c23, roughness: 0.7, metalness: 0.1 });
const dirtMat = new THREE.MeshStandardMaterial({ color: 0x1f1814, roughness: 0.95 });
const yellowLineMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4, emissive: 0xfacc15, emissiveIntensity: 0.1 });
const whiteLineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, emissive: 0xffffff, emissiveIntensity: 0.1 });
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2d1f16, roughness: 0.9 });
const foliageMats = [
new THREE.MeshStandardMaterial({ color: 0x0f3820, roughness: 0.8 }),
new THREE.MeshStandardMaterial({ color: 0x114226, roughness: 0.85 }),
new THREE.MeshStandardMaterial({ color: 0x0d301b, roughness: 0.75 })
];

function createPineTree() {
const tree = new THREE.Group();
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 8, 8), trunkMat);
trunk.position.y = 4; trunk.castShadow = true; tree.add(trunk);
for (let k = 0; k < 4; k++) {
const mat = foliageMats[k % foliageMats.length];
const cone = new THREE.Mesh(new THREE.ConeGeometry(3 - k * 0.5, 5.5 - k * 0.8, 8), mat);
cone.position.y = 4.5 + k * 2.2; cone.castShadow = true;
tree.add(cone);
}
return tree;
}

for (let i = -10; i <= 10; i++) {
const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 60), asphaltMat);
road.rotation.x = -Math.PI / 2; road.position.set(0, 0, i * 60);
road.receiveShadow = true;
roadGroup.add(road);
const dirtL = new THREE.Mesh(new THREE.PlaneGeometry(15, 60), dirtMat);
dirtL.rotation.x = -Math.PI / 2; dirtL.position.set(-14.5, -0.05, i * 60); dirtL.receiveShadow = true;
roadGroup.add(dirtL);
const dirtR = new THREE.Mesh(new THREE.PlaneGeometry(15, 60), dirtMat);
dirtR.rotation.x = -Math.PI / 2; dirtR.position.set(14.5, -0.05, i * 60); dirtR.receiveShadow = true;
roadGroup.add(dirtR);
const yLine1 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 60), yellowLineMat);
yLine1.rotation.x = -Math.PI / 2; yLine1.position.set(-0.2, 0.02, i * 60); roadGroup.add(yLine1);
const yLine2 = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 60), yellowLineMat);
yLine2.rotation.x = -Math.PI / 2; yLine2.position.set(0.2, 0.02, i * 60); roadGroup.add(yLine2);
const wLineL = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 60), whiteLineMat);
wLineL.rotation.x = -Math.PI / 2; wLineL.position.set(-6.5, 0.02, i * 60); roadGroup.add(wLineL);
const wLineR = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 60), whiteLineMat);
wLineR.rotation.x = -Math.PI / 2; wLineR.position.set(6.5, 0.02, i * 60); roadGroup.add(wLineR);
for (let t = -25; t <= 25; t += 10) {
const treeL = createPineTree(); treeL.scale.setScalar(0.8 + Math.random() * 0.6);
treeL.position.set(-10 - Math.random() * 6, 0, i * 60 + t + (Math.random() - 0.5) * 4);
roadGroup.add(treeL);
const treeR = createPineTree(); treeR.scale.setScalar(0.8 + Math.random() * 0.6);
treeR.position.set(10 + Math.random() * 6, 0, i * 60 + t + (Math.random() - 0.5) * 4);
roadGroup.add(treeR);
}
}

// CAR SETUP & FULLY EXPOSED DETAILED INTERIOR
const carGroup = new THREE.Group();
scene.add(carGroup);
const bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x111827, metalness: 0.8, roughness: 0.4, clearcoat: 1.0, clearcoatRoughness: 0.1 });
const intMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
const seatFabricMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.95 });
const seatTrimMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
const beltMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.6 });
const dashMat = new THREE.MeshStandardMaterial({ color: 0x182234, roughness: 0.6 });
const pedalMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.8, roughness: 0.2 });
const skinMat = new THREE.MeshStandardMaterial({ color: 0xd49a75, roughness: 0.5});
const hairMat = new THREE.MeshStandardMaterial({ color: 0x1c1714, roughness: 0.9 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, roughness: 0.05, transmission: 0.95, depthWrite: false });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
const rimMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 1.0, roughness: 0.2 });

// Lower Chassis Base
const chassis = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.45, 4.4), bodyMat);
chassis.position.y = 0.35; chassis.castShadow = true; chassis.receiveShadow = true; carGroup.add(chassis);

// Low Side Body Panels
const sidePanelL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 2.2), bodyMat);
sidePanelL.position.set(-1.0, 0.75, 0.1); carGroup.add(sidePanelL);
const sidePanelR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 2.2), bodyMat);
sidePanelR.position.set(1.0, 0.75, 0.1); carGroup.add(sidePanelR);

const windshield = new THREE.Mesh(new THREE.PlaneGeometry(1.85, 0.75), glassMat);
windshield.rotation.x = Math.PI / 3.5; windshield.position.set(0, 1.05, -0.75); carGroup.add(windshield);

// Fully Lit Interior Cockpit Floor
const cabinFloor = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 2.1), intMat);
cabinFloor.position.set(0, 0.48, 0.1); cabinFloor.receiveShadow = true;
carGroup.add(cabinFloor);

// Dedicated interior dome light ensuring the full cockpit stays illuminated
const intDomeLight = new THREE.PointLight(0xffffff, 1.2, 4.0);
intDomeLight.position.set(0, 1.45, -0.1);
carGroup.add(intDomeLight);

// Dashboard Base
const dashboard = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.35, 0.45), dashMat);
dashboard.position.set(0, 0.85, -0.42);
dashboard.castShadow = true; dashboard.receiveShadow = true;
carGroup.add(dashboard);

// Center Console & Shifter
const centerConsole = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.26, 1.2), dashMat);
centerConsole.position.set(0, 0.58, 0.1);
carGroup.add(centerConsole);

const gearShifter = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.12, 8), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 }));
gearShifter.position.set(0, 0.75, -0.1); carGroup.add(gearShifter);
const gearKnob = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
gearKnob.position.set(0, 0.81, -0.1); carGroup.add(gearKnob);

// Foot Pedals / Foot Rests in driver footwell
const pedalGroup = new THREE.Group();
pedalGroup.position.set(-0.45, 0.52, -0.55);
carGroup.add(pedalGroup);

const brakePedal = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.02), pedalMat);
brakePedal.position.set(-0.06, 0, 0); brakePedal.rotation.x = -Math.PI / 6; pedalGroup.add(brakePedal);

const gasPedal = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.02), pedalMat);
gasPedal.position.set(0.06, -0.02, 0); gasPedal.rotation.x = -Math.PI / 6; pedalGroup.add(gasPedal);

const footRest = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.14, 0.02), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }));
footRest.position.set(-0.16, 0, 0); footRest.rotation.x = -Math.PI / 6; pedalGroup.add(footRest);

// Realistic Bucket Seats with Seat Belts
function createBucketSeat(xPos, isDriver = false) {
const seat = new THREE.Group();
seat.position.set(xPos, 0.60, 0.2);

const seatBottom = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.14, 0.58), seatFabricMat);
seatBottom.position.set(0, 0, 0); seat.add(seatBottom);

const bolsterL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.56), seatTrimMat);
bolsterL.position.set(-0.23, 0.04, 0); seat.add(bolsterL);
const bolsterR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.56), seatTrimMat);
bolsterR.position.set(0.23, 0.04, 0); seat.add(bolsterR);

const seatBack = new THREE.Mesh(new THREE.BoxGeometry(0.50, 0.72, 0.14), seatFabricMat);
seatBack.position.set(0, 0.38, 0.24); seatBack.rotation.x = -0.15; seat.add(seatBack);

const headrest = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.20, 0.12), seatFabricMat);
headrest.position.set(0, 0.82, 0.33); headrest.rotation.x = -0.15; seat.add(headrest);

const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.08, 0.04), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
buckle.position.set(isDriver ? 0.22 : -0.22, 0.12, 0.05); seat.add(buckle);

if (isDriver) {
  const strapMesh = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.68, 0.01), beltMat);
  strapMesh.position.set(0.02, 0.38, 0.08);
  strapMesh.rotation.z = 0.52;
  strapMesh.rotation.x = -0.15;
  seat.add(strapMesh);
}
return seat;
}
carGroup.add(createBucketSeat(-0.45, true));
carGroup.add(createBucketSeat(0.45, false));

// DRIVER
const driverGroup = new THREE.Group();
driverGroup.position.set(-0.45, 0.72, 0.18);
carGroup.add(driverGroup);

const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 });
const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.23, 0.55, 16), sleeveMat);
torso.position.set(0, 0.275, 0.05); torso.rotation.x = -0.15; torso.castShadow = true;
driverGroup.add(torso);

const headGroup = new THREE.Group();
headGroup.position.set(0, 0.62, 0); driverGroup.add(headGroup);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 32), skinMat);
head.castShadow = true; headGroup.add(head);
const hairCap = new THREE.Mesh(new THREE.SphereGeometry(0.185, 32, 32), hairMat);
hairCap.position.set(0, 0.03, 0.04); headGroup.add(hairCap);

// ARMS SNAPPED DIRECTLY TO SMART STEERING WHEEL PADS
const armLGroup = new THREE.Group();
armLGroup.position.set(-0.19, 0.44, 0.0);
driverGroup.add(armLGroup);

const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.032, 0.34, 16), sleeveMat);

function setStress(mode, isAuto = false) {
stressMode = mode;
isAutoWarning = isAuto;
document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
if (mode === 'normal') document.getElementById('btnNormal').classList.add('active');
if (mode === 'warning') document.getElementById('btnWarning').classList.add('active');
if (mode === 'cardiac') document.getElementById('btnCardiac').classList.add('active');

const colorHex = stressMode === 'cardiac' ? 0xef4444 : (stressMode === 'warning' ? 0xf59e0b : 0x10b981);

padMat.color.setHex(colorHex);
padMat.emissive.setHex(colorHex);
tabletScreenMat.color.setHex(colorHex);
tabletScreenMat.emissive.setHex(colorHex);
dashGlow.color.setHex(colorHex);
dashGlow.intensity = (stressMode === 'cardiac') ? 1.6 : 1.0;

let stateStr = mode === 'cardiac' ? 'CARDIAC EVENT' : (mode === 'warning' ? 'WARNING' : 'NORMAL');
document.getElementById('dispStatus').innerText = stateStr;
document.getElementById('statusBadge').className = `status-badge ${mode === 'cardiac' ? 'CARDIAC_EVENT' : (mode === 'warning' ? 'WARNING' : 'NORMAL')}`;

if (mode === 'cardiac') {
  emergencyOverride = true;
  currentBPM = 152;
  currentSTDev = 0.45;
  healthData.hr = 152;
  healthData.temp = 38.6;
  healthData.grip = 48;
  healthData.sweat = 8.8;
  healthData.conf = 98;
} else if (mode === 'warning') {
  emergencyOverride = false;
  currentBPM = 102;
  currentSTDev = 0.15;
  healthData.hr = 102;
  healthData.temp = 37.3;
  healthData.grip = 34;
  healthData.sweat = 5.6;
  healthData.conf = 92;
} else {
  emergencyOverride = false;
  currentBPM = 72;
  currentSTDev = 0.0;
  healthData.hr = 72;
  healthData.temp = 36.6;
  healthData.grip = 20;
  healthData.sweat = 3.0;
  healthData.conf = 99;
}
updateTelemetryUI();
}

let prevCarPos = carGroup.position.clone();

function updateAudio(time) {
if (!audioInitialized) return;
if (emergencyOverride) {
engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
const isBeep = (time % 300) < 150;
alarmGain.gain.setTargetAtTime(isBeep ? 0.15 : 0, audioCtx.currentTime, 0.02);
alarmOsc.frequency.value = 900;
} else {
engineGain.gain.setTargetAtTime(0.3, audioCtx.currentTime, 0.5);
engineOsc.frequency.setTargetAtTime(30 + (Math.abs(carSpeed) * 150), audioCtx.currentTime, 0.1);
engineFilter.frequency.setTargetAtTime(100 + (Math.abs(carSpeed) * 800), audioCtx.currentTime, 0.1);
if (stressMode === 'warning') {
const isBeep = (time % 600) < 200;
alarmGain.gain.setTargetAtTime(isBeep ? 0.1 : 0, audioCtx.currentTime, 0.05);
alarmOsc.frequency.value = 600;
} else {
alarmGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
}
}
if (ambulanceActive) {
const isHigh = (time % 800) < 400;
sirenOsc.frequency.setTargetAtTime(isHigh ? 900 : 700, audioCtx.currentTime, 0.1);
const dist = Math.abs(ambulanceGroup.position.z - carGroup.position.z);
let vol = 0;
if (dist < 100) vol = 1.0 - (dist / 100);
if (emergencyPhase >= 4) vol *= 0.5;
sirenGain.gain.setTargetAtTime(vol * 0.15, audioCtx.currentTime, 0.2);
} else {
sirenGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
}
}

function updatePhysics() {
const time = Date.now();
updateAudio(time);

if (stressMode === 'normal') {
  healthData.hr = 72 + Math.sin(time * 0.003) * 2;
  healthData.sweat = 3.0 + Math.sin(time * 0.001) * 0.2;
} else if (stressMode === 'warning') {
  healthData.hr = 102 + Math.sin(time * 0.005) * 4;
  healthData.sweat = 5.6 + Math.sin(time * 0.002) * 0.4;
} else if (stressMode === 'cardiac') {
  healthData.hr = 152 + (Math.random() - 0.5) * 6;
  healthData.sweat = 8.8 + Math.sin(time * 0.004) * 0.5;
}
updateTelemetryUI();

if (!emergencyOverride) {
if (carGroup.position.x > 4.5 || carGroup.position.x < -4.5) {
if (stressMode == 'normal') setStress('warning', true);
} else if (stressMode === 'warning' && isAutoWarning && carGroup.position.x < 3.5 && carGroup.position.x > -3.5) {
setStress('normal', true);
}
}

trafficCars.forEach(tc => {
tc.mesh.position.z -= tc.speed;
if (tc.mesh.position.z > carGroup.position.z + 40) {
tc.mesh.position.z = carGroup.position.z - 150 - Math.random() * 100;
tc.mesh.position.x = (Math.random() > 0.5 ? 2.5 : -2.5);
tc.speed = 0.15 + Math.random() * 0.08;
}
const dx = carGroup.position.x - tc.mesh.position.x;
const dz = carGroup.position.z - tc.mesh.position.z;
const dist = Math.sqrt(dx * dx + dz * dz);
if (dist < 4.8 && !emergencyOverride) {
setStress('cardiac', false);
emergencyOverride = true;
carSpeed = -0.05;
camera.position.y += 0.4;
camera.position.x += (Math.random() - 0.5) * 0.8;
tc.speed = 0;
playCrashSound();
}
});

if (emergencyOverride) {
driverGroup.rotation.x = THREE.MathUtils.lerp(driverGroup.rotation.x, 0.6, 0.05);
headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, 0.5, 0.05);
armLGroup.rotation.x = THREE.MathUtils.lerp(armLGroup.rotation.x, 1.8, 0.05);
armRGroup.rotation.x = THREE.MathUtils.lerp(armRGroup.rotation.x, 1.8, 0.05);

if (carSpeed > 0.005) {
carGroup.rotation.y -= 0.003;
wheelGroup.rotation.z = -0.15;
carSpeed *= 0.92;
} else {
carSpeed = 0;
}

hzL.visible = Math.floor(time / 300) % 2 === 0;
hzR.visible = hzL.visible;

if (!ambulanceActive) {
ambulanceActive = true;
emergencyPhase = 0;
rescueTimer = 0;
ambulanceGroup.visible = true;
ambulanceGroup.position.set(carGroup.position.x + 3.0, 0, carGroup.position.z + 80);
ambSpeed = 0.45;
}

if (ambulanceActive) {
sirenLightRed.intensity = (Math.floor(time / 200) % 2 === 0) ? 28 : 0;
sirenLightBlue.intensity = (Math.floor(time / 200) % 2 !== 0) ? 28 : 0;

if (emergencyPhase === 0) {
if (ambulanceGroup.position.z > carGroup.position.z + 6.0) {
ambulanceGroup.position.z -= ambSpeed;
ambulanceGroup.position.x = THREE.MathUtils.lerp(ambulanceGroup.position.x, carGroup.position.x + 3.0, 0.05);
} else {
ambSpeed = 0;
emergencyPhase = 1;
nursesGroup.visible = true;
nursesGroup.position.set(ambulanceGroup.position.x, 0, ambulanceGroup.position.z + 2.6);
}
} else if (emergencyPhase === 1) {
rescueTimer += 0.015;
const targetX = carGroup.position.x - 1.5;
const targetZ = carGroup.position.z;
nursesGroup.position.lerp(new THREE.Vector3(targetX, 0, targetZ), 0.06);
if (rescueTimer > 2.5) {
emergencyPhase = 2;
rescueTimer = 0;
}
} else if (emergencyPhase === 2) {
rescueTimer += 0.015;
driverGroup.visible = false;
rescuedDriver.visible = true;
if (rescueTimer > 1.5) {
emergencyPhase = 3;
rescueTimer = 0;
}
} else if (emergencyPhase === 3) {
rescueTimer += 0.015;
const targetX = ambulanceGroup.position.x;
const targetZ = ambulanceGroup.position.z + 2.6;
nursesGroup.position.lerp(new THREE.Vector3(targetX, 0, targetZ), 0.06);
if (rescueTimer > 3.0) {
nursesGroup.visible = false;
rescuedDriver.visible = false;
emergencyPhase = 4;
}
} else if (emergencyPhase === 4) {
ambulanceGroup.position.x = THREE.MathUtils.lerp(ambulanceGroup.position.x, carGroup.position.x, 0.03);
ambulanceGroup.position.z -= 0.55;
if (ambulanceGroup.position.z < carGroup.position.z - 80) {
emergencyPhase = 5;
}
} else if (emergencyPhase === 5) {
document.getElementById('restartContainer').style.display = 'flex';
}
}
} else {
ambulanceActive = false;
ambulanceGroup.visible = false;
nursesGroup.visible = false;
rescuedDriver.visible = false;
driverGroup.visible = true;
sirenLightRed.intensity = 0;
sirenLightBlue.intensity = 0;
document.getElementById('restartContainer').style.display = 'none';
emergencyPhase = 0;
rescueTimer = 0;

const breathe = Math.sin(time * 0.002) * 0.015;
torso.scale.set(1 + breathe, 1, 1 - breathe * 1.5);
driverGroup.rotation.x = THREE.MathUtils.lerp(driverGroup.rotation.x, 0, 0.1);
headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, 0, 0.1);

// Maintain firm driver grip locked onto steering wheel
armLGroup.rotation.x = THREE.MathUtils.lerp(armLGroup.rotation.x, 0, 0.1);
armLGroup.rotation.y = THREE.MathUtils.lerp(armLGroup.rotation.y, 0, 0.1);
armRGroup.rotation.x = THREE.MathUtils.lerp(armRGroup.rotation.x, 0, 0.1);
armRGroup.rotation.y = THREE.MathUtils.lerp(armRGroup.rotation.y, 0, 0.1);
hzL.visible = false; hzR.visible = false;

if (keys['w']) carSpeed = Math.min(carSpeed + 0.015, 0.35);
else if (keys['s']) carSpeed = Math.max(carSpeed - 0.015, -0.1);
else carSpeed *= 0.96;
}

if (Math.abs(carSpeed) > 0.005 && !emergencyOverride) {
if (keys['a']) { carGroup.rotation.y += 0.028; wheelGroup.rotation.z = 0.4; }
else if (keys['d']) { carGroup.rotation.y -= 0.028; wheelGroup.rotation.z = -0.4; }
else { wheelGroup.rotation.z = 0; }
}

carGroup.translateZ(-carSpeed);
carGroup.position.x = Math.max(-7.0, Math.min(7.0, carGroup.position.x));

const carDelta = new THREE.Vector3().subVectors(carGroup.position, prevCarPos);
camera.position.add(carDelta);
controls.target.copy(carGroup.position);
prevCarPos.copy(carGroup.position);

roadGroup.position.z = Math.floor(carGroup.position.z / 60) * 60;
}

// ECG DRAWING
const ecgCanvas = document.getElementById('ecgCanvas');
const ecgCtx = ecgCanvas.getContext('2d');
let ecgHistory = new Array(150).fill(0);
let ecgPhase = 0;

function generatePQRSTSample(phase, stDev) {
const p = phase % (2 * Math.PI);
if (p > 0.2 && p < 0.6) return 0.15 * Math.sin((p - 0.2) * (Math.PI / 0.4));
if (p > 0.8 && p < 0.9) return -0.15;
if (p >= 0.9 && p <= 1.05) return 1.2 * Math.sin((p - 0.9) * (Math.PI / 0.15));
if (p > 1.05 && p < 1.2) return -0.35 * Math.sin((p - 1.05) * (Math.PI / 0.15));
if (p > 1.4 && p < 2.2) return (0.25 + stDev) * Math.sin((p - 1.4) * (Math.PI / 0.8)) + stDev;
return (Math.random() - 0.5) * 0.02;
}

function drawECG() {
ecgPhase += (currentBPM / 60) * 0.18;
ecgHistory.push(generatePQRSTSample(ecgPhase, currentSTDev));
ecgHistory.shift();

ecgCtx.clearRect(0, 0, 280, 60);
ecgCtx.strokeStyle = "rgba(16, 185, 129, 0.08)";
for (let x = 0; x < 280; x += 15) { ecgCtx.beginPath(); ecgCtx.moveTo(x, 0); ecgCtx.lineTo(x, 60); ecgCtx.stroke(); }
ecgCtx.strokeStyle = stressMode === 'cardiac' ? '#ef4444' : (stressMode === 'warning' ? '#f59e0b' : '#10b981');
ecgCtx.lineWidth = 2.5;
ecgCtx.lineJoin = 'round';
ecgCtx.beginPath();
const step = 280 / ecgHistory.length;
let x = 0;
for (let i = 0; i < ecgHistory.length; i++) {
const y = 35 - (ecgHistory[i] * 20);
if (i === 0) ecgCtx.moveTo(x, y); else ecgCtx.lineTo(x, y);
x += step;
}
ecgCtx.stroke();
}

async function sendTelemetry() {
try {
const res = await fetch('/api/telemetry', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ speed: Math.round(Math.abs(carSpeed) * 300), stress_mode: stressMode })
});
const data = await res.json();
currentBPM = data.sensors.heart_rate_bpm;
currentSTDev = data.sensors.st_deviation_mv;
healthData.hr = data.sensors.heart_rate_bpm;
healthData.temp = data.sensors.skin_temp_celsius;
healthData.grip = data.sensors.grip_force_newton;
healthData.sweat = data.sensors.sweat_microsiemens;
healthData.conf = data.prediction.confidence;

if (!isAutoWarning) {
let finalState = stressMode === 'normal' ? data.prediction.stable_prediction : (stressMode === 'warning' ? 'WARNING' : 'CARDIAC EVENT');
document.getElementById('dispStatus').innerText = finalState;
document.getElementById('statusBadge').className = `status-badge ${finalState.replace(' ', '_')}`;
}
if (data.emergency_protocol && data.emergency_protocol.active) {
emergencyOverride = true;
} else if (stressMode === 'normal') {
emergencyOverride = false;
}
} catch (e) {}
}

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
requestAnimationFrame(animate);
updatePhysics();
controls.update();
drawECG();
renderer.render(scene, camera);
}

setInterval(sendTelemetry, 300);
animate();
</script>
</body>
</html>
